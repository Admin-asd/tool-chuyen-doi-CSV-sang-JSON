<!doctype html>
<!-- Vị trí file: wp-content/gb-tools/converters/chuyen-doi-csv-sang-json.html -->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Công cụ chuyển đổi CSV sang JSON online - CSV to JSON Converter</title>
<meta name="description" content="Chuyển đổi CSV sang JSON và mảng JSON ngược lại thành CSV trực tuyến nhanh chóng với tùy chọn dấu phân cách, hàng tiêu đề và suy luận kiểu dữ liệu.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
<style type="text/tailwindcss">
  @theme {
    --font-sans: Roboto, ui-sans-serif, system-ui, sans-serif;
    --color-primary: #fdca1e; --color-primary-hover: #e8b008; --color-primary-soft: #fffbeb;
    --color-primary-ink: #9c6406; --color-ink: #0f172a; --color-neutral: #e2e8f0;
  }
</style>
</head>
<body class="bg-white font-sans text-ink antialiased">
<main class="mx-auto max-w-5xl p-4 sm:p-6 space-y-6">
  
  <div class="bg-white border border-neutral rounded-2xl shadow-xs overflow-hidden">
    
    <!-- Hàng điều khiển 1: Tiêu đề công cụ, Chế độ, Dấu phân cách, Hàng tiêu đề & Badge trạng thái -->
    <div class="p-4 sm:px-6 border-b border-neutral flex flex-wrap items-center justify-between gap-3 bg-slate-50/50">
      <div class="flex flex-wrap items-center gap-3">
        <span class="font-bold text-sm text-ink">Công cụ chuyển đổi CSV sang JSON</span>
        
        <!-- Select Chế độ -->
        <div class="flex items-center gap-2">
          <label for="modeSelect" class="text-xs font-semibold text-slate-500">Chế độ</label>
          <select id="modeSelect" onchange="handleModeChange()" class="rounded-xl border border-neutral bg-white px-3 py-2 text-xs font-bold text-ink outline-none focus:border-primary cursor-pointer">
            <option value="csv2json">Chuyển đổi CSV sang JSON</option>
            <option value="json2csv">Chuyển đổi JSON sang CSV</option>
          </select>
        </div>

        <!-- Select Dấu phân cách -->
        <div class="flex items-center gap-2">
          <label for="delimiterSelect" class="text-xs font-semibold text-slate-500">Dấu phân cách</label>
          <select id="delimiterSelect" onchange="autoConvertIfReady()" class="rounded-xl border border-neutral bg-white px-3 py-2 text-xs font-bold text-ink outline-none focus:border-primary cursor-pointer">
            <option value=",">Dấu phẩy (,)</option>
            <option value=";">Dấu chấm phẩy (;)</option>
            <option value="&#9;">Tab</option>
            <option value="|">Ống (|)</option>
          </select>
        </div>

        <!-- Checkbox Hàng tiêu đề -->
        <label class="flex items-center gap-2 rounded-xl border border-neutral bg-white px-3 py-2 text-xs font-bold text-ink cursor-pointer hover:border-primary select-none">
          <input type="checkbox" id="chkHeader" checked onchange="autoConvertIfReady()" class="w-3.5 h-3.5 rounded accent-amber-500 cursor-pointer">
          <span>Hàng tiêu đề</span>
        </label>
      </div>

      <!-- Badge trạng thái -->
      <span id="statusBadge" class="px-3 py-1 rounded-lg border border-neutral bg-white text-[11px] font-bold text-slate-500">
        Đang chờ
      </span>
    </div>

    <!-- Hàng điều khiển 2: Suy luận số/boolean & Các nút thao tác -->
    <div class="p-4 sm:px-6 border-b border-neutral flex flex-wrap items-center gap-2.5 bg-white">
      <label id="inferWrapper" class="flex items-center gap-2 rounded-xl border border-neutral bg-slate-50/70 px-3.5 py-2 text-xs font-semibold text-slate-700 cursor-pointer hover:border-primary select-none">
        <input type="checkbox" id="chkInfer" onchange="autoConvertIfReady()" class="w-3.5 h-3.5 rounded accent-amber-500 cursor-pointer">
        <span>Suy luận số/boolean</span>
      </label>

      <button type="button" onclick="executeConvert()" class="min-h-9 rounded-xl bg-primary px-5 font-bold text-xs text-ink hover:bg-primary-hover shadow-xs cursor-pointer transition-colors">
        Chuyển đổi
      </button>

      <button type="button" onclick="swapOutputToInput()" class="min-h-9 rounded-xl border border-neutral bg-white px-4 font-semibold text-xs text-ink hover:border-primary cursor-pointer transition-colors">
        Sử dụng đầu ra làm đầu vào
      </button>

      <button type="button" onclick="copyOutput()" class="min-h-9 rounded-xl border border-neutral bg-white px-4 font-semibold text-xs text-ink hover:border-primary cursor-pointer transition-colors">
        Sao chép đầu ra
      </button>

      <button type="button" onclick="clearAll()" class="min-h-9 rounded-xl border border-neutral bg-white px-4 font-semibold text-xs text-slate-600 hover:border-primary hover:text-ink cursor-pointer transition-colors">
        Xóa
      </button>
    </div>

    <!-- Thanh gợi ý thông tin -->
    <div id="helperBar" class="px-6 py-2.5 bg-primary-soft/60 border-b border-neutral text-xs text-primary-ink font-medium">
      CSV sử dụng dấu phân cách đã chọn. Tắt hàng tiêu đề để xuất ra mảng thay vì đối tượng.
    </div>

    <!-- Khu vực làm việc 2 cột song song (Đầu vào & Đầu ra) -->
    <div class="grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-neutral">
      
      <!-- Cột trái: Đầu vào -->
      <div class="flex flex-col">
        <div class="px-5 py-3 border-b border-neutral bg-slate-50/40 flex items-center justify-between">
          <span id="inputTitle" class="font-bold text-xs text-ink">Nhập CSV</span>
          <span id="inputCharCount" class="text-xs font-mono text-slate-400">0 ký tự</span>
        </div>
        <textarea id="inputArea" rows="13" oninput="updateCharCount()" placeholder="Tên, email&#10;Ada, ada@example.com&#10;Grace, grace@example.com" class="w-full flex-1 p-5 text-xs font-mono text-ink outline-none bg-white resize-y leading-relaxed"></textarea>
      </div>

      <!-- Cột phải: Đầu ra -->
      <div class="flex flex-col bg-slate-50/20">
        <div class="px-5 py-3 border-b border-neutral bg-slate-50/40 flex items-center justify-between">
          <span id="outputTitle" class="font-bold text-xs text-primary-ink">Đầu ra JSON</span>
          <span id="outputStatus" class="text-xs font-mono text-slate-400">Sẵn sàng</span>
        </div>
        <textarea id="outputArea" rows="13" readonly placeholder="Kết quả chuyển đổi sẽ hiển thị tại đây..." class="w-full flex-1 p-5 text-xs font-mono text-ink outline-none bg-transparent resize-y leading-relaxed"></textarea>
      </div>

    </div>

  </div>

</main>

<script>
  async function gbCopy(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
    const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select(); const ok = document.execCommand('copy'); t.remove(); return ok;
  }

  function updateCharCount() {
    const val = document.getElementById('inputArea').value;
    document.getElementById('inputCharCount').textContent = `${val.length} ký tự`;
  }

  function handleModeChange() {
    const mode = document.getElementById('modeSelect').value;
    const inputTitle = document.getElementById('inputTitle');
    const outputTitle = document.getElementById('outputTitle');
    const inputArea = document.getElementById('inputArea');
    const helperBar = document.getElementById('helperBar');
    const inferWrapper = document.getElementById('inferWrapper');

    if (mode === 'csv2json') {
      inputTitle.textContent = 'Nhập CSV';
      outputTitle.textContent = 'Đầu ra JSON';
      inputArea.placeholder = 'Tên, email\nAda, ada@example.com\nGrace, grace@example.com';
      helperBar.textContent = 'CSV sử dụng dấu phân cách đã chọn. Tắt hàng tiêu đề để xuất ra mảng thay vì đối tượng.';
      inferWrapper.classList.remove('opacity-50', 'pointer-events-none');
    } else {
      inputTitle.textContent = 'Nhập JSON';
      outputTitle.textContent = 'Đầu ra CSV';
      inputArea.placeholder = '[\n  { "Tên": "Ada", "email": "ada@example.com" },\n  { "Tên": "Grace", "email": "grace@example.com" }\n]';
      helperBar.textContent = 'Dán mảng đối tượng JSON hoặc mảng 2 chiều. Các trường chứa dấu phân cách sẽ tự động bọc ngoặc kép.';
      inferWrapper.classList.add('opacity-50', 'pointer-events-none');
    }

    document.getElementById('outputArea').value = '';
    setStatus('Đang chờ', 'Sẵn sàng', false);
  }

  function setStatus(badgeText, rightText, isError) {
    const badge = document.getElementById('statusBadge');
    const right = document.getElementById('outputStatus');
    badge.textContent = badgeText;
    right.textContent = rightText;

    if (isError) {
      badge.className = 'px-3 py-1 rounded-lg border border-red-200 bg-red-50 text-[11px] font-bold text-red-600';
      right.className = 'text-xs font-mono text-red-500 font-bold';
    } else if (badgeText === 'Hoàn tất') {
      badge.className = 'px-3 py-1 rounded-lg border border-amber-300 bg-primary-soft text-[11px] font-bold text-primary-ink';
      right.className = 'text-xs font-mono text-primary-ink font-bold';
    } else {
      badge.className = 'px-3 py-1 rounded-lg border border-neutral bg-white text-[11px] font-bold text-slate-500';
      right.className = 'text-xs font-mono text-slate-400';
    }
  }

  // Bộ phân tích CSV chuẩn RFC 4180 (hỗ trợ trích dẫn ngoặc kép và xuống dòng trong ô)
  function parseCSV(text, delimiter) {
    const rows = [];
    let currentRow = [];
    let currentVal = '';
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      const nextChar = text[i + 1];

      if (inQuotes) {
        if (char === '"' && nextChar === '"') {
          currentVal += '"';
          i++;
        } else if (char === '"') {
          inQuotes = false;
        } else {
          currentVal += char;
        }
      } else {
        if (char === '"') {
          inQuotes = true;
        } else if (char === delimiter) {
          currentRow.push(currentVal.trim());
          currentVal = '';
        } else if (char === '\r' && nextChar === '\n') {
          currentRow.push(currentVal.trim());
          rows.push(currentRow);
          currentRow = [];
          currentVal = '';
          i++;
        } else if (char === '\n' || char === '\r') {
          currentRow.push(currentVal.trim());
          rows.push(currentRow);
          currentRow = [];
          currentVal = '';
        } else {
          currentVal += char;
        }
      }
    }

    if (currentVal.length > 0 || currentRow.length > 0) {
      currentRow.push(currentVal.trim());
      rows.push(currentRow);
    }

    return rows.filter(r => !(r.length === 1 && r[0] === ''));
  }

  function inferValue(val) {
    if (val === '') return '';
    const lower = val.toLowerCase();
    if (lower === 'true') return true;
    if (lower === 'false') return false;
    if (lower === 'null') return null;
    if (!isNaN(val) && !isNaN(parseFloat(val))) return Number(val);
    return val;
  }

  function formatCSVField(val, delimiter) {
    if (val === null || val === undefined) return '';
    const str = typeof val === 'object' ? JSON.stringify(val) : String(val);
    if (str.includes(delimiter) || str.includes('"') || str.includes('\n') || str.includes('\r')) {
      return '"' + str.replace(/"/g, '""') + '"';
    }
    return str;
  }

  function executeConvert() {
    const rawInput = document.getElementById('inputArea').value.trim();
    if (!rawInput) {
      setStatus('Đang chờ', 'Chưa có dữ liệu', false);
      return;
    }

    const mode = document.getElementById('modeSelect').value;
    const delimiter = document.getElementById('delimiterSelect').value;
    const hasHeader = document.getElementById('chkHeader').checked;
    const inferTypes = document.getElementById('chkInfer').checked;

    try {
      if (mode === 'csv2json') {
        const rows = parseCSV(rawInput, delimiter);
        if (rows.length === 0) {
          document.getElementById('outputArea').value = '[]';
          setStatus('Hoàn tất', '0 mục', false);
          return;
        }

        let result;
        if (hasHeader) {
          const headers = rows[0].map((h, idx) => h || `column_${idx + 1}`);
          result = rows.slice(1).map(row => {
            const obj = {};
            headers.forEach((h, idx) => {
              const rawCell = row[idx] !== undefined ? row[idx] : '';
              obj[h] = inferTypes ? inferValue(rawCell) : rawCell;
            });
            return obj;
          });
        } else {
          result = rows.map(row => row.map(cell => inferTypes ? inferValue(cell) : cell));
        }

        document.getElementById('outputArea').value = JSON.stringify(result, null, 2);
        setStatus('Hoàn tất', `${result.length} bản ghi`, false);
      } else {
        // JSON sang CSV
        const parsed = JSON.parse(rawInput);
        if (!Array.isArray(parsed)) {
          throw new Error('Dữ liệu JSON phải là một mảng ([...]).');
        }
        if (parsed.length === 0) {
          document.getElementById('outputArea').value = '';
          setStatus('Hoàn tất', '0 dòng', false);
          return;
        }

        const lines = [];
        if (typeof parsed[0] === 'object' && parsed[0] !== null && !Array.isArray(parsed[0])) {
          // Mảng các đối tượng
          const headers = Array.from(new Set(parsed.flatMap(item => Object.keys(item || {}))));
          if (hasHeader) {
            lines.push(headers.map(h => formatCSVField(h, delimiter)).join(delimiter));
          }
          parsed.forEach(item => {
            const row = headers.map(h => formatCSVField(item ? item[h] : '', delimiter));
            lines.push(row.join(delimiter));
          });
        } else if (Array.isArray(parsed[0])) {
          // Mảng 2 chiều
          parsed.forEach(rowArr => {
            lines.push(rowArr.map(cell => formatCSVField(cell, delimiter)).join(delimiter));
          });
        } else {
          // Mảng 1 chiều đơn giản
          if (hasHeader) lines.push('value');
          parsed.forEach(val => lines.push(formatCSVField(val, delimiter)));
        }

        document.getElementById('outputArea').value = lines.join('\n');
        setStatus('Hoàn tất', `${lines.length} dòng`, false);
      }
    } catch (err) {
      document.getElementById('outputArea').value = `Lỗi định dạng: ${err.message}`;
      setStatus('Lỗi cú pháp', 'Kiểm tra lại dữ liệu', true);
    }
  }

  function autoConvertIfReady() {
    if (document.getElementById('outputArea').value.trim() !== '') {
      executeConvert();
    }
  }

  function swapOutputToInput() {
    const outVal = document.getElementById('outputArea').value;
    if (!outVal) return;

    const modeSelect = document.getElementById('modeSelect');
    modeSelect.value = modeSelect.value === 'csv2json' ? 'json2csv' : 'csv2json';
    handleModeChange();

    document.getElementById('inputArea').value = outVal;
    updateCharCount();
    executeConvert();
  }

  async function copyOutput() {
    const outVal = document.getElementById('outputArea').value;
    if (!outVal) return;
    const ok = await gbCopy(outVal);
    if (ok) alert('Đã sao chép kết quả đầu ra vào bộ nhớ tạm!');
  }

  function clearAll() {
    document.getElementById('inputArea').value = '';
    document.getElementById('outputArea').value = '';
    updateCharCount();
    setStatus('Đang chờ', 'Sẵn sàng', false);
  }
</script>
</body>
</html>
